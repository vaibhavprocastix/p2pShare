version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8081:8081"
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M