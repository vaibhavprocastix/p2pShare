<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Workspace</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="centered">

<div class="join-card">
  <h1>🔒 Secure Workspace</h1>
  <p class="muted">Peer-to-peer file sharing workspace</p>

  <input id="roomId" placeholder="Room ID" maxlength="20" />
  <input id="password" type="password" placeholder="Room Password" />
  <input id="username" placeholder="Your Name" maxlength="30" />

  <button class="primary" onclick="createRoom()">Create New Room</button>
  <button class="secondary" onclick="joinRoom()">Join Existing Room</button>

  <div id="status" class="status-msg"></div>
</div>

<script>
const ws = new WebSocket("ws://localhost:8081");
let pendingAction = null;

ws.onopen = () => {
  status.textContent = "Connected";
  status.className = "status-msg success";
};

ws.onerror = () => {
  status.textContent = "Connection error. Is the server running?";
  status.className = "status-msg error";
};

function getData() {
  const room = roomId.value.trim();
  const pass = password.value.trim();
  const user = username.value.trim();

  if (!room || !pass || !user) {
    status.textContent = "Please fill all fields";
    status.className = "status-msg error";
    return null;
  }

  return { roomId: room, password: pass, username: user };
}

function createRoom() {
  const data = getData();
  if (!data) return;

  pendingAction = "create";
  ws.send(JSON.stringify({ type: "create-room", ...data }));
  status.textContent = "Creating room...";
  status.className = "status-msg";
}

function joinRoom() {
  const data = getData();
  if (!data) return;

  pendingAction = "join";
  ws.send(JSON.stringify({ type: "join-room", ...data }));
  status.textContent = "Joining room...";
  status.className = "status-msg";
}

ws.onmessage = e => {
  const msg = JSON.parse(e.data);

  if (msg.type === "error") {
    status.textContent = msg.error;
    status.className = "status-msg error";
    pendingAction = null;
  }

  if (msg.type === "room-created") {
    // Auto-join after creation
    const data = getData();
    ws.send(JSON.stringify({ type: "join-room", ...data }));
  }

  if (msg.type === "room-state") {
    // Save to session and redirect
    sessionStorage.setItem("roomId", roomId.value);
    sessionStorage.setItem("password", password.value);
    sessionStorage.setItem("username", username.value);
    sessionStorage.setItem("userId", msg.userId);
    sessionStorage.setItem("isOwner", msg.isOwner);
    location.href = "workspace.html";
  }
};
</script>

</body>
</html>
