<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Workspace</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="centered">

<div class="join-card glass">
  <h1>🔒 Secure Workspace</h1>
  <p class="muted">Peer-to-peer file sharing workspace</p>

  <input id="roomId" placeholder="Room ID" maxlength="20" />
  <input id="password" type="password" placeholder="Room Password" />
  <input id="username" placeholder="Your Name" maxlength="30" />

  <button class="primary" id="createRoomBtn">Create New Room</button>
  <button class="secondary" id="joinRoomBtn">Join Existing Room</button>

  <div id="status" class="status-msg"></div>
</div>

<script src="index.js"></script>

</body>
</html>
