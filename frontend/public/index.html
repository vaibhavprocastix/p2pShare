<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Join Workspace</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="centered">

<div class="join-card">
  <h1>Workspace</h1>
  <p class="muted">Secure peer-to-peer file workspace</p>

  <input id="roomId" placeholder="Room ID" />
  <input id="password" type="password" placeholder="Room Password" />
  <input id="username" placeholder="Your Name" />

  <button class="primary" onclick="enter()">Enter Room</button>
</div>

<script>
function enter() {
  sessionStorage.setItem("roomId", roomId.value);
  sessionStorage.setItem("password", password.value);
  sessionStorage.setItem("username", username.value);
  location.href = "workspace.html";
}
</script>

</body>
</html>
