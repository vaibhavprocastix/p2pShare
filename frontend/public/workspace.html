<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>Room</h2>
    
    <div class="upload-box" id="uploadBox">
      <div>
        <div style="font-size: 48px; margin-bottom: 10px;">📁</div>
        <div>Drag and drop<br/>or click here to<br/>add files to workspace</div>
      </div>
    </div>
    <input type="file" id="fileInput" hidden multiple />

    <div class="room-info">
      <p><strong>Room ID:</strong> <span id="roomIdDisplay"></span></p>
      <p><strong>Password:</strong> <span id="passDisplay"></span></p>
      <p><strong>Users Online:</strong> <span id="userCount">1</span></p>
      <p><strong>Host:</strong> <span id="hostDisplay"></span></p>
    </div>

    <button class="danger" id="killBtn" onclick="killRoom()" style="display: none;">
      🗑️ Destroy Room
    </button>

    <button class="secondary" onclick="leaveRoom()">
      🚪 Leave Room
    </button>
  </div>

  <!-- MAIN WORKSPACE -->
  <div class="workspace">
    <h2>Shared Workspace</h2>
    <div id="emptyState" class="empty-state">
      No files yet. Upload files to share with everyone in the room.
    </div>
    <div class="file-grid" id="fileGrid"></div>
  </div>
</div>

<script src="webrtc.js"></script>

</body>
</html>
