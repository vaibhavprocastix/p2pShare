<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace Launcher</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 300px;
      padding: 20px;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e8eaf6;
    }

    h2 {
      font-size: 18px;
      margin-bottom: 8px;
      text-align: center;
      color: #eaf2ff;
    }

    .subtitle {
      font-size: 12px;
      color: #7b8fa3;
      text-align: center;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #4da3ff 0%, #2979ff 100%);
      color: white;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(41, 121, 255, 0.4);
    }

    .info {
      margin-top: 16px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      font-size: 11px;
      color: #7b8fa3;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h2>🔒 Secure Workspace</h2>
  <p class="subtitle">P2P File Sharing</p>
  
  <button id="openWorkspace">Open Workspace</button>
  
  <div class="info">
    A new window will open with the workspace interface
  </div>

  <script src="popup.js"></script>
</body>
</html>
