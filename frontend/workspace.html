<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">
  <!-- HEADER SECTION -->
  <div class="header-section">
    <!-- UPLOAD AREA -->
    <div class="upload-area">
      <div class="upload-box glass" id="uploadBox">
        <div>
          <div style="font-size: 40px; margin-bottom: 8px;">📁</div>
          <div>Drag & Drop<br/>or Click here</div>
        </div>
      </div>
      <input type="file" id="fileInput" hidden multiple />
    </div>

    <!-- ROOM INFO SIDEBAR -->
    <div class="room-sidebar">
      <div class="room-info glass-dark">
        <p><strong>Room ID:</strong> <span id="roomIdDisplay"></span></p>
        <p><strong>Password:</strong> <span id="passDisplay"></span></p>
        <p><strong>Members:</strong> <span id="userCount">1</span></p>
        <p><strong>Host:</strong> <span id="hostDisplay"></span></p>
      </div>

      <div class="room-actions">
        <button class="danger" id="killBtn" style="display: none;">
          Kill Room
        </button>
        <button class="leave-btn secondary" id="leaveBtn">
          Leave Room
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN WORKSPACE -->
  <div class="workspace">
    <h2>P2P Workspace</h2>
    <div id="emptyState" class="empty-state">
      No files yet. Upload files to share.
    </div>
    <div class="file-grid" id="fileGrid"></div>
  </div>
</div>

<script src="webrtc.js"></script>

</body>
</html>
